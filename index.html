                "@type": "Question",
                "name": "Where does my Tiger work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Your Tiger starts on Telegram, and you can add LINE from your dashboard once you're set up. More channels are on the way. It follows up where your prospects actually are — not by blasting everywhere at once."
                }
              },
              {
                "@type": "Question",
                "name": "What about LINE?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "LINE is an add-on you turn on from your dashboard after you're up and running on Telegram. Once it's connected, your Tiger keeps the conversation going there too."
                }
              },
              {
                "@type": "Question",
                "name": "What do I need before checkout?",
                "acceptedAnswer": {
                  "@type": "Answer",

                }
              },
              {
                "@type": "Question",
                "name": "Does a booking mean Tiger worked?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Not by itself. A booking only matters when the conversation shows qualified movement. Tiger Claw is built to value the conversation quality and handoff context before the booking."
                }
              },
              {
                "@type": "Question",
                "name": "Does Tiger Claw promise business results?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Tiger Claw helps with conversation memory, follow-up, objection support, notes, and next-step guidance. It does not promise a specific business outcome."
                }
              },

                "@type": "Question",

                  "@type": "Answer",
                  "text": "Yes. You are responsible for company policies, compensation-plan rules, advertising rules, privacy rules, do-not-contact requests, and communication requirements."
                }
              },
              {
                "@type": "Question",
                "name": "Who owns my prospect conversation data?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "You own the prospect conversation data, notes, and records you provide. Tiger Claw uses that information to operate, support, secure, and improve the service."
                }
              },
              {
                "@type": "Question",
                "name": "Can I export or delete my data?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. You can request export or deletion by contacting help@tigerclaw.io. Cancellation does not trap you or remove your ability to request export or deletion of eligible data."
